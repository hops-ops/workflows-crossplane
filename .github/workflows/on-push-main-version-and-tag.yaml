name: on-push-main-version-and-tag
on:
  push:
    branches:
    - main

permissions:
  packages: write
  contents: write

jobs:

  version-and-tag:
    name: Version and Tag
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@v1.22.2
    secrets:
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
    with:
      useDeployKey: true
      
